# Cron ingest worker — companion to the SvelteKit Pages app
name = "swft-cron-ingest"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Single `*/5` schedule with an in-worker skip-gate replaces the old
# `*/3 + */5 + */15` triad. The worker reads its own monitoring mode from
# system_state and decides per-fire whether to do real work (hourly in
# normal, every 15 min in elevated, every 5 min in storm). Weekly link
# health check retained on its own schedule.
[triggers]
crons = ["*/5 * * * *", "0 12 * * 1"]

[vars]
SITE_URL = "https://swft.skypixels.org"

[[d1_databases]]
binding = "DB"
database_name = "swpc-web-db"
database_id = "4756af4f-cd26-4394-a65f-f35899aa11d8"
